[project]
name = "mcp-redteam"
version = "0.1.0"
description = "Dynamic red-team toolkit for Model Context Protocol (MCP) servers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "ai-security",
    "llm-security",
    "mcp",
    "model-context-protocol",
    "prompt-injection",
    "red-team",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.27.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "starlette>=1.2.0",
    "typer>=0.26.2",
    "uvicorn>=0.48.0",
]

[project.urls]
Homepage = "https://github.com/codezxsWIN/mcp-redteam"
Repository = "https://github.com/codezxsWIN/mcp-redteam"
Issues = "https://github.com/codezxsWIN/mcp-redteam/issues"

[project.scripts]
mcp-redteam = "mcp_redteam.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "mcp_redteam",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
